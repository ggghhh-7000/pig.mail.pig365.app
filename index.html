<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>pig-mail.pages.dev</title>
  <style>
    .btn { padding: 12px 20px; margin: 8px; font-size: 16px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
    .ms-btn { background-color: #0078d4; color: white; }
    .g-btn { background-color: #4285f4; color: white; }
  </style>
</head>
<body>
  <h1>Go to pig e mail</h1>
  
  <!-- 按鈕 1: 前往 Microsoft OAuth 頁面 -->
  <button class="btn ms-btn" onclick="redirectToMS()">使用 Microsoft OAuth 登入</button>
  
  <!-- 按鈕 2: 前往 Google OAuth 頁面 -->
  <button class="btn g-btn" onclick="redirectToGoogle()">使用 Google OAuth 登入</button>

  <script>
    function redirectToMS() {
      // 帶上 redirect_url 參數，方便 Netlify 頁面驗證後跳轉回來
      window.location.href = "https://OAuth-pig-mail.netlify.app?redirect_url=" + encodeURIComponent(window.location.href);
    }

    function redirectToGoogle() {
      window.location.href = "https://g-auth-oooo.netlify.app?redirect_url=" + encodeURIComponent(window.location.href);
    }
  </script>
</body>
</html>
