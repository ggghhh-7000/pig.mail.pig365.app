<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pig eMAIL - 登入</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { margin-top: 0; color: #202124; font-size: 24px; }
    p { color: #5f6368; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      margin: 12px 0;
      font-size: 16px;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-ms { background-color: #0078d4; color: white; }
    .btn-ms:hover { background-color: #005a9e; }
    .btn-google { background-color: #1a73e8; color: white; }
    .btn-google:hover { background-color: #1557b0; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Go to pig eMAIL</h1>
    <p>請選擇您的身分驗證管道：</p>
    
    <button class="btn btn-ms" onclick="redirectToMS()">使用 Microsoft OAuth 登入</button>
    <button class="btn btn-google" onclick="redirectToGoogle()">使用 Google OAuth 登入</button>
  </div>

  <script>
    const HOME_URL = "https://pig-mail-pig365-app.pages.dev/home";

    function redirectToMS() {
      window.location.href = "https://OAuth-pig-mail.netlify.app?redirect_url=" + encodeURIComponent(HOME_URL);
    }

    function redirectToGoogle() {
      window.location.href = "https://g-auth-oooo.netlify.app?redirect_url=" + encodeURIComponent(HOME_URL);
    }
  </script>
</body>
</html>
